<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Goyanshi Mohanty</title>

    <!-- Google Fonts: Inter (matches main portfolio) + Playfair for elegance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/intro.css">
</head>
<body>

    <!-- ═══════════════════════════════════════════════════════════
         INTRO WRAPPER  (everything lives inside here)
    ════════════════════════════════════════════════════════════════ -->
    <div id="intro-wrapper">

        <!-- Pure black fallback background + ambient glow -->
        <div id="intro-fallback-bg"></div>

        <!-- Floating particles canvas (z-index 0, behind video) -->
        <canvas id="particles-canvas"></canvas>

        
        <video
            id="intro-video"
            playsinline
            muted
            preload="auto"
            aria-hidden="true"
        >
            <source src="intro-video.mp4" type="video/mp4">
        </video>

        <!-- ── STYLISH TEXT OVERLAY ──────────────────────────────── -->
        <div id="intro-text" role="banner" aria-label="Introduction">
            <span class="intro-greeting">Hi, my name is</span>
            <span class="intro-name">Goyanshi</span>
            <span class="intro-underline" aria-hidden="true"></span>
        </div>

        <!-- ── SKIP BUTTON ───────────────────────────────────────── -->
        <button id="skip-btn" aria-label="Skip intro and go to portfolio">
            Skip &nbsp;›
        </button>

        <!-- ── VIDEO PROGRESS BAR (bottom edge) ─────────────────── -->
        <div id="intro-progress-bar" role="progressbar" aria-label="Intro progress"></div>

        <!-- ── CINEMATIC CORNER ACCENTS ─────────────────────────── -->
        <span class="corner corner-tl" aria-hidden="true"></span>
        <span class="corner corner-tr" aria-hidden="true"></span>
        <span class="corner corner-bl" aria-hidden="true"></span>
        <span class="corner corner-br" aria-hidden="true"></span>

    </div><!-- /#intro-wrapper -->

    <!-- ── CINEMATIC TRANSITION OVERLAY (fades to black before redirect) -->
    <div id="transition-overlay" aria-hidden="true"></div>

    <script src="js/intro.js"></script>
</body>
</html>
